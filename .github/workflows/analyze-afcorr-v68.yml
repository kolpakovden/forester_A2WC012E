name: Analyze v68 AF Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-afcorr-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Capstone
        run: python3 -m pip install --user 'capstone>=5.0.0'

      - name: Trace AF correction RAM literals
        shell: python
        run: |
          from pathlib import Path
          import capstone
          b=Path('roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin').read_bytes()
          out=[]
          def p(s=''): out.append(str(s))
          mode=capstone.CS_MODE_SH2|capstone.CS_MODE_BIG_ENDIAN
          if hasattr(capstone,'CS_MODE_SHFPU'): mode |= capstone.CS_MODE_SHFPU
          md=capstone.Cs(capstone.CS_ARCH_SH,mode)

          def dump(lo,hi,title):
              p('')
              p('==== '+title+f' 0x{lo:06X}-0x{hi:06X} ====')
              for ins in md.disasm(b[lo:hi],lo):
                  raw=b[ins.address:ins.address+ins.size].hex(' ')
                  p(f'{ins.address:06X}: {raw:<8} {ins.mnemonic:<12} {ins.op_str}')

          p('A2WC012E v68 AF Correction 16-bit RAM literal trace')
          p('target float: 0xFFFFB538')
          p('target mirror: 0xFFFFB330')

          # SH MOV.W @(disp,PC),Rn: 1001 nnnn dddddddd.
          # Loaded word is sign-extended, so literal B538 becomes FFFFB538.
          refs=[]
          for pc in range(0,len(b)-1,2):
              op=(b[pc]<<8)|b[pc+1]
              if (op & 0xF000)==0x9000:
                  lit=pc+4+(op&0xff)*2
                  if lit+2<=len(b):
                      w=int.from_bytes(b[lit:lit+2],'big')
                      val=w if w<0x8000 else 0xFFFF0000|w
                      if 0xFFFFB000 <= val <= 0xFFFFB8FF:
                          refs.append((pc,lit,val,(op>>8)&0xf,op))

          p('')
          p(f'16-bit sign-extended refs in FFFFB000-FFFFB8FF: {len(refs)}')
          for pc,lit,val,rn,op in refs:
              mark=' <<< TARGET' if val in (0xFFFFB538,0xFFFFB330) else ''
              p(f'pc=0x{pc:06X} op={op:04X} literal=0x{lit:06X} word={val&0xffff:04X} value=0x{val:08X} -> r{rn}{mark}')

          targets=[x for x in refs if x[2] in (0xFFFFB538,0xFFFFB330)]
          p('')
          p('TARGET REFERENCE COUNT: '+str(len(targets)))
          for pc,lit,val,rn,op in targets:
              dump(max(0,pc-0x80),min(len(b),pc+0x100),f'TARGET ref pc=0x{pc:06X} -> 0x{val:08X} r{rn}')

          # Also dump the whole confirmed closed-loop cluster and literal pool bytes.
          dump(0x1F700,0x1FB20,'closed-loop/O2 cluster')
          p('')
          p('==== raw literal pool 0x1F820-0x1F880 ====')
          for a in range(0x1F820,0x1F880,16):
              p(f'{a:06X}: '+b[a:a+16].hex(' '))

          Path('evidence/afcorr-v68-ram16-trace.txt').write_text('\n'.join(out)+'\n')

      - name: Commit analysis report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/afcorr-v68-ram16-trace.txt
          if git diff --cached --quiet; then
            echo 'analysis report unchanged'
            exit 0
          fi
          git commit -m 'Add v68 AF correction 16-bit RAM trace'
          git push
