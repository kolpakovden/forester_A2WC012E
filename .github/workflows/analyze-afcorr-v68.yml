name: Analyze v68 AF Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-afcorr-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python3 -m pip install --user 'capstone>=5.0.0'
      - name: Focus target references
        shell: python
        run: |
          from pathlib import Path
          import capstone
          b=Path('roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin').read_bytes()
          mode=capstone.CS_MODE_SH2|capstone.CS_MODE_BIG_ENDIAN
          if hasattr(capstone,'CS_MODE_SHFPU'): mode |= capstone.CS_MODE_SHFPU
          md=capstone.Cs(capstone.CS_ARCH_SH,mode)
          out=[]
          def p(s=''): out.append(str(s))
          def dis(lo,hi):
              for ins in md.disasm(b[lo:hi],lo):
                  raw=b[ins.address:ins.address+ins.size].hex(' ')
                  p(f'{ins.address:06X}: {raw:<8} {ins.mnemonic:<12} {ins.op_str}')
          refs=[]
          for pc in range(0,len(b)-1,2):
              op=(b[pc]<<8)|b[pc+1]
              if (op&0xF000)==0x9000:
                  lit=pc+4+(op&0xff)*2
                  if lit+2<=len(b):
                      w=int.from_bytes(b[lit:lit+2],'big')
                      if w in (0xB538,0xB330):
                          refs.append((pc,lit,w,(op>>8)&0xf))
          p('A2WC012E v68 focused A/F Correction references')
          p('B538=float A/F Correction #1; B330=2-byte mirror')
          p('count='+str(len(refs)))
          for n,(pc,lit,w,rn) in enumerate(refs,1):
              p('')
              p(f'===== REF {n}: pc=0x{pc:06X}, target=0xFFFF{w:04X}, r{rn}, literal=0x{lit:06X} =====')
              lo=max(0,pc-0x60); hi=min(len(b),pc+0x80)
              dis(lo,hi)
              p('RAW LITERAL AREA:')
              la=max(0,lit-0x10)&~1; lh=min(len(b),lit+0x20)
              for a in range(la,lh,16): p(f'{a:06X}: '+b[a:min(a+16,lh)].hex(' '))
          Path('evidence/afcorr-v68-target-refs.txt').write_text('\n'.join(out)+'\n')
      - name: Commit focused report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/afcorr-v68-target-refs.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add focused v68 AF correction references'
          git push
