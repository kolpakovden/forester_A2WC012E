name: Analyze v68 AF Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-afcorr-v68.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python3 -m pip install --user 'capstone>=5.0.0'
      - name: Prove common clamp helper
        shell: python
        run: |
          from pathlib import Path
          import capstone, struct
          b=Path('roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin').read_bytes()
          mode=capstone.CS_MODE_SH2|capstone.CS_MODE_BIG_ENDIAN
          if hasattr(capstone,'CS_MODE_SHFPU'): mode |= capstone.CS_MODE_SHFPU
          md=capstone.Cs(capstone.CS_ARCH_SH,mode); md.skipdata=True
          for lo,hi,title in [(0x23E0,0x24C0,'helper around 0x2464'),(0x209b0,0x20a18,'stage A final clamp/store'),(0x20bd4,0x20c3c,'stage B final clamp/store'),(0x20df8,0x20e60,'stage C final clamp/store')]:
              print('\n====',title,'====')
              for ins in md.disasm(b[lo:hi],lo):
                  raw=b[ins.address:ins.address+ins.size].hex(' ')
                  print(f'{ins.address:06X}: {raw:<8} {ins.mnemonic:<12} {ins.op_str}')
          print('\nFLOAT LITERALS')
          for off in [0x209c0,0x209c4,0x20be4,0x20be8,0x20e08,0x20e0c]:
              print(f'0x{off:06X} {b[off:off+4].hex()} {struct.unpack(">f",b[off:off+4])[0]}')
