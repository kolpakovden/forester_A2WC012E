name: Analyze v68 AF Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-afcorr-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python3 -m pip install --user 'capstone>=5.0.0'
      - name: Trace candidate callers
        shell: python
        run: |
          from pathlib import Path
          import capstone
          b=Path('roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin').read_bytes()
          mode=capstone.CS_MODE_SH2|capstone.CS_MODE_BIG_ENDIAN
          if hasattr(capstone,'CS_MODE_SHFPU'): mode |= capstone.CS_MODE_SHFPU
          md=capstone.Cs(capstone.CS_ARCH_SH,mode); md.skipdata=True
          out=[]
          def p(s=''): out.append(str(s))
          def dis(lo,hi):
              for ins in md.disasm(b[lo:hi],lo):
                  raw=b[ins.address:ins.address+ins.size].hex(' ')
                  p(f'{ins.address:06X}: {raw:<8} {ins.mnemonic:<12} {ins.op_str}')
          def direct_bsr_callers(target):
              hits=[]
              for pc in range(0,len(b)-1,2):
                  op=(b[pc]<<8)|b[pc+1]
                  if (op&0xF000)==0xB000:
                      d=op&0xfff
                      if d&0x800: d-=0x1000
                      dst=(pc+4+d*2)&0xffffffff
                      if dst==target: hits.append(pc)
              return hits
          def literal_refs(target):
              hits=[]
              pat=target.to_bytes(4,'big')
              s=0
              while True:
                  j=b.find(pat,s)
                  if j<0: break
                  hits.append(j); s=j+1
              return hits
          targets=[0x1ED34,0x1FECC,0x207A2,0x20830,0x208EC,0x20B10,0x20D34,0x211C2,0x3C256,0x4B28C]
          p('A2WC012E v68 AF correction candidate call graph')
          for t in targets:
              p('')
              p(f'===== TARGET 0x{t:06X} =====')
              bs=direct_bsr_callers(t); lr=literal_refs(t)
              p('direct BSR callers: '+(', '.join(f'0x{x:06X}' for x in bs) if bs else 'none'))
              p('32-bit literal occurrences: '+(', '.join(f'0x{x:06X}' for x in lr) if lr else 'none'))
              for pc in bs:
                  p(f'-- caller around 0x{pc:06X} --'); dis(max(0,pc-0x30),min(len(b),pc+0x50))
              for lit in lr:
                  # list MOV.L PC-relative refs to this literal and nearby JSRs
                  refs=[]
                  for pc in range(max(0,lit-0x404),min(len(b)-1,lit+2),2):
                      op=(b[pc]<<8)|b[pc+1]
                      if (op&0xF000)==0xD000:
                          l=((pc+4)&~3)+(op&0xff)*4
                          if l==lit: refs.append((pc,(op>>8)&0xf))
                  for pc,rn in refs:
                      p(f'-- literal ref pc=0x{pc:06X} -> r{rn} --'); dis(max(0,pc-0x20),min(len(b),pc+0x50))
          Path('evidence/afcorr-v68-callgraph.txt').write_text('\n'.join(out)+'\n')
      - name: Commit callgraph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/afcorr-v68-callgraph.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v68 AF correction call graph'
          git push
