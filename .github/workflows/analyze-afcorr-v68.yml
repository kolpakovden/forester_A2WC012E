name: Analyze v68 AF Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-afcorr-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Capstone
        run: python3 -m pip install --user 'capstone>=5.0.0'

      - name: Disassemble AF correction neighborhood
        shell: python
        run: |
          from pathlib import Path
          import capstone
          b=Path('roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin').read_bytes()
          out=[]
          def p(s=''): out.append(str(s))
          p('A2WC012E v68 AF Correction static disassembly')
          p('target: A/F Correction #1 float RAM 0xFFFFB538')
          p('mirror: 0xFFFFB330')
          p('')
          p('capstone version: '+capstone.__version__)
          p('CS_ARCH_SH present: '+str(hasattr(capstone,'CS_ARCH_SH')))
          if not hasattr(capstone,'CS_ARCH_SH'):
              raise SystemExit('Capstone build has no SuperH support')
          modes=[]
          for n in ['CS_MODE_SH2','CS_MODE_SH2A','CS_MODE_BIG_ENDIAN','CS_MODE_SHFPU']:
              if hasattr(capstone,n): modes.append((n,getattr(capstone,n)))
          p('available SH modes: '+repr(modes))
          mode=getattr(capstone,'CS_MODE_SH2',0) | getattr(capstone,'CS_MODE_BIG_ENDIAN',0)
          if hasattr(capstone,'CS_MODE_SHFPU'): mode |= capstone.CS_MODE_SHFPU
          md=capstone.Cs(capstone.CS_ARCH_SH, mode)
          md.detail=True

          def dump(lo,hi,title):
              p('')
              p('==== '+title+f' 0x{lo:06X}-0x{hi:06X} ====')
              for ins in md.disasm(b[lo:hi],lo):
                  raw=b[ins.address:ins.address+ins.size].hex(' ')
                  p(f'{ins.address:06X}: {raw:<8} {ins.mnemonic:<12} {ins.op_str}')

          # Main cluster containing literals B524/B530/B535/B536/B537.
          dump(0x1F450,0x1F900,'closed-loop/O2 cluster')

          # Find every PC-relative MOV.L literal whose value is within B500-B560,
          # then disassemble +/- 0x60 around the instruction.
          refs=[]
          for pc in range(0,len(b)-1,2):
              op=(b[pc]<<8)|b[pc+1]
              if (op & 0xF000)==0xD000:
                  lit=((pc+4)&~3)+(op&0xff)*4
                  if lit+4<=len(b):
                      val=int.from_bytes(b[lit:lit+4],'big')
                      if 0xFFFFB500 <= val <= 0xFFFFB560:
                          refs.append((pc,lit,val,(op>>8)&0xf))
          p('')
          p('==== references to RAM literals B500-B560 ====')
          for pc,lit,val,rn in refs:
              p(f'pc=0x{pc:06X} literal=0x{lit:06X} value=0x{val:08X} -> r{rn}')
          seen=set()
          for pc,lit,val,rn in refs:
              lo=max(0,(pc-0x50)&~1); hi=min(len(b),(pc+0x80)&~1)
              key=(lo,hi)
              if key in seen: continue
              seen.add(key)
              dump(lo,hi,f'RAM ref near 0x{pc:06X} -> 0x{val:08X}')

          Path('evidence/afcorr-v68-disassembly.txt').write_text('\n'.join(out)+'\n')

      - name: Commit analysis report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/afcorr-v68-disassembly.txt
          if git diff --cached --quiet; then
            echo 'analysis report unchanged'
            exit 0
          fi
          git commit -m 'Add v68 AF correction disassembly'
          git push
