name: Analyze v68 AF Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-afcorr-v68.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact v68
        shell: bash
        run: |
          echo '8f02eecf37fad5340baf0ba5d66e62308a979660b4926c6ad0559fc53f869ecc  roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin' | sha256sum -c -
      - name: Stage exact v68
        shell: bash
        run: |
          mkdir -p artifact
          cp roms/experimental/v68/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin artifact/
      - name: Upload exact v68
        uses: actions/upload-artifact@v4
        with:
          name: A2WC012E_v68_exact_analysis_base
          path: artifact/forester_sg9_sti_MAP_IAT_GM_dMap_v68_SPARK_CUT_ENABLED.bin
          retention-days: 7
